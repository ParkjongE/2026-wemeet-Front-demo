<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="scene4Title">
  <title id="scene4Title">한 명은 흙을 파고 한 명은 꽃씨를 심으며 함께 웃는 장면</title>
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky4)"/>
  <circle cx="90" cy="66" r="30" fill="#FFE5A0" opacity="0.9"/>

  <path d="M0 300 Q150 276 300 296 Q450 316 600 288 L600 400 L0 400 Z" fill="#DCEFE8"/>
  <path d="M0 322 Q150 302 300 318 Q450 334 600 308 L600 400 L0 400 Z" fill="#C7E6DC"/>
  <ellipse cx="300" cy="350" rx="150" ry="26" fill="#C99A6B"/>
  <g stroke="#8FCB9B" stroke-width="4" stroke-linecap="round">
    <line x1="250" y1="340" x2="250" y2="322"/>
    <line x1="300" y1="345" x2="300" y2="324"/>
  </g>

  <!-- 서아 sitting, digging -->
  <g transform="translate(190 250)">
    <ellipse cx="30" cy="88" rx="22" ry="12" fill="#FBD9B6"/>
    <ellipse cx="66" cy="88" rx="22" ry="12" fill="#FBD9B6"/>

    <rect x="12" y="10" width="72" height="58" rx="24" fill="#FFF3DD"/>
    <path d="M16 34 L82 34 L88 90 Q48 102 8 90 Z" fill="#A8DAD0"/>
    <rect x="24" y="6" width="12" height="32" rx="5" fill="#8FC4B7"/>
    <rect x="62" y="6" width="12" height="32" rx="5" fill="#8FC4B7"/>
    <rect x="34" y="42" width="28" height="22" rx="6" fill="#FFB4A2"/>

    <rect x="-18" y="42" width="18" height="46" rx="9" fill="#FBD9B6" transform="rotate(24 -9 42)"/>
    <g transform="translate(-42 78) rotate(-14)">
      <rect x="0" y="0" width="6" height="52" rx="3" fill="#C98F6B"/>
      <path d="M-13 48 h32 l-6 22 a16 16 0 0 1 -20 0 Z" fill="#FFE5A0" stroke="#D9B65A" stroke-width="2"/>
    </g>
    <rect x="86" y="46" width="17" height="40" rx="8" fill="#FBD9B6" transform="rotate(-8 94 46)"/>

    <circle cx="48" cy="-30" r="40" fill="#FBD9B6"/>
    <path d="M8 -38 Q8 -76 48 -76 Q88 -76 88 -38 Q88 -58 48 -58 Q8 -58 8 -38 Z" fill="#5C4433"/>
    <ellipse cx="41" cy="-80" rx="6" ry="10" fill="#8FCB9B" transform="rotate(-18 41 -80)"/>
    <ellipse cx="54" cy="-81" rx="6" ry="10" fill="#8FCB9B" transform="rotate(14 54 -81)"/>
    <ellipse cx="24" cy="-18" rx="8" ry="5" fill="#FFB4A2" opacity="0.75"/>
    <ellipse cx="72" cy="-18" rx="8" ry="5" fill="#FFB4A2" opacity="0.75"/>
    <circle cx="36" cy="-32" r="4.2" fill="#453D38"/>
    <circle cx="60" cy="-32" r="4.2" fill="#453D38"/>
    <path d="M34 -16 Q48 -6 62 -16" stroke="#453D38" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- friend sitting, placing seeds -->
  <g transform="translate(340 254)">
    <ellipse cx="26" cy="84" rx="20" ry="11" fill="#FBD9B6"/>
    <ellipse cx="58" cy="84" rx="20" ry="11" fill="#FBD9B6"/>

    <path d="M10 26 L74 26 L80 82 Q42 94 4 82 Z" fill="#FFB4A2"/>
    <rect x="-14" y="30" width="16" height="40" rx="8" fill="#FBD9B6" transform="rotate(30 -6 30)"/>
    <rect x="76" y="34" width="16" height="38" rx="8" fill="#FBD9B6" transform="rotate(-18 84 34)"/>

    <circle cx="42" cy="-8" r="36" fill="#FBD9B6"/>
    <path d="M6 -12 Q6 -44 42 -44 Q78 -44 78 -12 Q78 -28 42 -28 Q6 -28 6 -12 Z" fill="#7A5C42"/>
    <ellipse cx="22" cy="0" rx="6.5" ry="4.2" fill="#FFB4A2" opacity="0.75"/>
    <ellipse cx="62" cy="0" rx="6.5" ry="4.2" fill="#FFB4A2" opacity="0.75"/>
    <path d="M29 -4 Q35 -8 41 -4" stroke="#453D38" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M43 -4 Q49 -8 55 -4" stroke="#453D38" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M32 10 Q42 18 52 10" stroke="#453D38" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- seed in hand -->
    <circle cx="14" cy="66" r="4" fill="#8FCB9B"/>
  </g>

  <!-- little seedlings already popping up between them -->
  <g stroke="#8FCB9B" stroke-width="4" stroke-linecap="round">
    <line x1="330" y1="340" x2="330" y2="318"/>
  </g>
  <circle cx="330" cy="314" r="6" fill="#B7E3A0"/>
</svg>
