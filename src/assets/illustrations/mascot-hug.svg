<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-labelledby="haruHugTitle">
  <title id="haruHugTitle">그림책을 안고 기뻐하는 아기 캐릭터 하루</title>
  <defs>
    <linearGradient id="overallsHug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B7E3D9"/>
      <stop offset="100%" stop-color="#94CFC1"/>
    </linearGradient>
  </defs>

  <!-- legs -->
  <rect x="76" y="172" width="22" height="44" rx="11" fill="#FBD9B6"/>
  <rect x="104" y="172" width="22" height="44" rx="11" fill="#FBD9B6"/>
  <ellipse cx="87" cy="218" rx="16" ry="9" fill="#C98F6B"/>
  <ellipse cx="115" cy="218" rx="16" ry="9" fill="#C98F6B"/>

  <!-- cream top -->
  <rect x="66" y="112" width="68" height="58" rx="24" fill="#FFF3DD"/>

  <!-- hugged book -->
  <g transform="translate(64 128)">
    <rect x="0" y="0" width="72" height="52" rx="8" fill="#FFB4A2"/>
    <rect x="6" y="6" width="60" height="40" rx="5" fill="#FFFFFF"/>
    <path d="M36 6 v40" stroke="#E8785F" stroke-width="2"/>
    <path d="M14 18 Q20 12 26 18" stroke="#E8785F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M46 18 Q52 12 58 18" stroke="#E8785F" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- arms wrapping the book -->
  <rect x="48" y="140" width="20" height="48" rx="10" fill="#FBD9B6" transform="rotate(24 58 140)"/>
  <rect x="132" y="140" width="20" height="48" rx="10" fill="#FBD9B6" transform="rotate(-24 142 140)"/>

  <!-- overalls -->
  <path d="M70 150 L130 150 L135 206 Q100 218 65 206 Z" fill="url(#overallsHug)"/>
  <rect x="76" y="110" width="12" height="42" rx="5" fill="#94CFC1"/>
  <rect x="112" y="110" width="12" height="42" rx="5" fill="#94CFC1"/>

  <!-- head, joyful tilt -->
  <circle cx="100" cy="70" r="40" fill="#FBD9B6"/>

  <!-- hair -->
  <path d="M60 62 Q60 24 100 24 Q140 24 140 62 Q140 42 100 42 Q60 42 60 62 Z" fill="#5C4433"/>
  <ellipse cx="93" cy="20" rx="6" ry="10" fill="#8FCB9B" transform="rotate(-18 93 20)"/>
  <ellipse cx="106" cy="19" rx="6" ry="10" fill="#8FCB9B" transform="rotate(14 106 19)"/>

  <!-- blush, bigger for joy -->
  <ellipse cx="75" cy="82" rx="9" ry="6" fill="#FFB4A2" opacity="0.8"/>
  <ellipse cx="125" cy="82" rx="9" ry="6" fill="#FFB4A2" opacity="0.8"/>

  <!-- happy closed eyes ^^ -->
  <path d="M78 70 Q86 62 94 70" stroke="#453D38" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M106 70 Q114 62 122 70" stroke="#453D38" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- big smile -->
  <path d="M86 84 Q100 96 114 84" stroke="#453D38" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M42 60 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" fill="#FFE5A0"/>
  <path d="M158 96 l2.5 5.5 5.5 2.5 -5.5 2.5 -2.5 5.5 -2.5 -5.5 -5.5 -2.5 5.5 -2.5 Z" fill="#FFE5A0"/>
</svg>
