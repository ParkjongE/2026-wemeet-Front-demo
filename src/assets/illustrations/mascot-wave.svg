<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-labelledby="haruWaveTitle">
  <title id="haruWaveTitle">손을 흔드는 아기 캐릭터 하루</title>
  <defs>
    <linearGradient id="overallsWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B7E3D9"/>
      <stop offset="100%" stop-color="#94CFC1"/>
    </linearGradient>
  </defs>

  <!-- back arm waving -->
  <g transform="rotate(-35 148 128)">
    <rect x="138" y="98" width="22" height="62" rx="11" fill="#FBD9B6"/>
  </g>
  <circle cx="152" cy="92" r="13" fill="#FBD9B6"/>

  <!-- legs -->
  <rect x="76" y="168" width="22" height="46" rx="11" fill="#FBD9B6"/>
  <rect x="104" y="168" width="22" height="46" rx="11" fill="#FBD9B6"/>
  <ellipse cx="87" cy="216" rx="16" ry="9" fill="#C98F6B"/>
  <ellipse cx="115" cy="216" rx="16" ry="9" fill="#C98F6B"/>

  <!-- cream top -->
  <rect x="68" y="112" width="66" height="60" rx="24" fill="#FFF3DD"/>

  <!-- front arm down -->
  <rect x="56" y="128" width="20" height="56" rx="10" fill="#FBD9B6"/>
  <circle cx="66" cy="186" r="12" fill="#FBD9B6"/>

  <!-- overalls -->
  <path d="M70 140 L130 140 L136 202 Q100 214 64 202 Z" fill="url(#overallsWave)"/>
  <rect x="76" y="108" width="12" height="38" rx="5" fill="#94CFC1"/>
  <rect x="112" y="108" width="12" height="38" rx="5" fill="#94CFC1"/>
  <rect x="86" y="150" width="28" height="24" rx="6" fill="#FFB4A2"/>

  <!-- head -->
  <circle cx="100" cy="70" r="40" fill="#FBD9B6"/>

  <!-- hair -->
  <path d="M60 62 Q60 24 100 24 Q140 24 140 62 Q140 42 100 42 Q60 42 60 62 Z" fill="#5C4433"/>
  <ellipse cx="93" cy="20" rx="6" ry="10" fill="#8FCB9B" transform="rotate(-18 93 20)"/>
  <ellipse cx="106" cy="19" rx="6" ry="10" fill="#8FCB9B" transform="rotate(14 106 19)"/>

  <!-- blush -->
  <ellipse cx="76" cy="82" rx="8" ry="5" fill="#FFB4A2" opacity="0.7"/>
  <ellipse cx="124" cy="82" rx="8" ry="5" fill="#FFB4A2" opacity="0.7"/>

  <!-- eyes -->
  <circle cx="86" cy="70" r="4.5" fill="#453D38"/>
  <circle cx="114" cy="70" r="4.5" fill="#453D38"/>
  <circle cx="87.5" cy="68.5" r="1.4" fill="#fff"/>
  <circle cx="115.5" cy="68.5" r="1.4" fill="#fff"/>

  <!-- smile -->
  <path d="M90 84 Q100 92 110 84" stroke="#453D38" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
