<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="scene1Title">
  <title id="scene1Title">서아가 노란 삽과 꽃씨를 들고 작은 정원에 도착한 아침 장면</title>
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky1)"/>
  <circle cx="500" cy="80" r="46" fill="#FFE5A0"/>
  <g stroke="#FFE5A0" stroke-width="6" stroke-linecap="round">
    <line x1="500" y1="10" x2="500" y2="26"/>
    <line x1="500" y1="134" x2="500" y2="150"/>
    <line x1="430" y1="80" x2="446" y2="80"/>
    <line x1="554" y1="80" x2="570" y2="80"/>
  </g>

  <path d="M0 320 Q150 290 300 315 Q450 340 600 310 L600 400 L0 400 Z" fill="#DCEFE8"/>
  <path d="M0 340 Q150 320 300 338 Q450 356 600 330 L600 400 L0 400 Z" fill="#C7E6DC"/>

  <!-- garden bed -->
  <ellipse cx="180" cy="352" rx="90" ry="20" fill="#C99A6B"/>
  <g stroke="#8FCB9B" stroke-width="4" stroke-linecap="round">
    <line x1="130" y1="345" x2="130" y2="330"/>
    <line x1="160" y1="342" x2="160" y2="322"/>
    <line x1="200" y1="344" x2="200" y2="326"/>
  </g>

  <!-- 서아 standing -->
  <g transform="translate(250 190)">
    <rect x="16" y="90" width="24" height="46" rx="12" fill="#FBD9B6"/>
    <rect x="52" y="90" width="24" height="46" rx="12" fill="#FBD9B6"/>
    <ellipse cx="28" cy="138" rx="16" ry="9" fill="#C98F6B"/>
    <ellipse cx="64" cy="138" rx="16" ry="9" fill="#C98F6B"/>

    <rect x="8" y="44" width="76" height="60" rx="24" fill="#FFF3DD"/>
    <path d="M12 70 L80 70 L86 128 Q46 140 6 128 Z" fill="#A8DAD0"/>
    <rect x="20" y="40" width="12" height="34" rx="5" fill="#8FC4B7"/>
    <rect x="60" y="40" width="12" height="34" rx="5" fill="#8FC4B7"/>
    <rect x="32" y="78" width="28" height="22" rx="6" fill="#FFB4A2"/>

    <!-- holding shovel -->
    <rect x="-18" y="78" width="18" height="44" rx="9" fill="#FBD9B6" transform="rotate(18 -9 78)"/>
    <g transform="translate(-40 108) rotate(-10)">
      <rect x="0" y="0" width="6" height="60" rx="3" fill="#C98F6B"/>
      <path d="M-14 56 h34 l-6 26 a17 17 0 0 1 -22 0 Z" fill="#FFE5A0" stroke="#D9B65A" stroke-width="2"/>
    </g>

    <!-- other arm holding seed packet -->
    <rect x="84" y="78" width="18" height="40" rx="9" fill="#FBD9B6" transform="rotate(-14 93 78)"/>
    <rect x="98" y="108" width="26" height="30" rx="4" fill="#FFFFFF" stroke="#E8785F" stroke-width="2"/>
    <circle cx="111" cy="120" r="6" fill="#FFB4A2"/>

    <circle cx="46" cy="6" r="40" fill="#FBD9B6"/>
    <path d="M6 -2 Q6 -40 46 -40 Q86 -40 86 -2 Q86 -22 46 -22 Q6 -22 6 -2 Z" fill="#5C4433"/>
    <ellipse cx="39" cy="-44" rx="6" ry="10" fill="#8FCB9B" transform="rotate(-18 39 -44)"/>
    <ellipse cx="52" cy="-45" rx="6" ry="10" fill="#8FCB9B" transform="rotate(14 52 -45)"/>
    <ellipse cx="22" cy="18" rx="8" ry="5" fill="#FFB4A2" opacity="0.75"/>
    <ellipse cx="70" cy="18" rx="8" ry="5" fill="#FFB4A2" opacity="0.75"/>
    <circle cx="34" cy="4" r="4.2" fill="#453D38"/>
    <circle cx="58" cy="4" r="4.2" fill="#453D38"/>
    <path d="M32 20 Q46 30 60 20" stroke="#453D38" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
