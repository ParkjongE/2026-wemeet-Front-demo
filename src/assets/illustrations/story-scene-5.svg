<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="scene5Title">
  <title id="scene5Title">꽃이 활짝 핀 정원에서 나란히 앉아 웃는 서아와 친구, 옆에 놓인 노란 삽</title>
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky5)"/>
  <circle cx="500" cy="70" r="40" fill="#FFE5A0" opacity="0.9"/>

