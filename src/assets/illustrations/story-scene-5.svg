  <g>
    <g transform="translate(90 300)"><line x1="0" y1="0" x2="0" y2="34" stroke="#8FCB9B" stroke-width="4"/><circle r="12" fill="#FFB4A2"/><circle r="4" fill="#FFE5A0"/></g>
    <g transform="translate(140 292)"><line x1="0" y1="0" x2="0" y2="40" stroke="#8FCB9B" stroke-width="4"/><circle r="13" fill="#A8DAD0"/><circle r="4.5" fill="#FFE5A0"/></g>
    <g transform="translate(440 296)"><line x1="0" y1="0" x2="0" y2="36" stroke="#8FCB9B" stroke-width="4"/><circle r="12" fill="#FFE5A0"/><circle r="4" fill="#FFB4A2"/></g>
    <g transform="translate(495 306)"><line x1="0" y1="0" x2="0" y2="30" stroke="#8FCB9B" stroke-width="4"/><circle r="11" fill="#FFB4A2"/><circle r="4" fill="#FFE5A0"/></g>
    <g transform="translate(510 280)"><line x1="0" y1="0" x2="0" y2="42" stroke="#8FCB9B" stroke-width="4"/><circle r="13" fill="#A8DAD0"/><circle r="4.5" fill="#FFE5A0"/></g>
  </g>

